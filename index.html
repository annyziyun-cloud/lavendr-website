<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavend/r | 舒適感與空間美學</title>
    <!-- 引入優雅襯線體(標題)與乾淨無襯線體(內文) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&family=Noto+Sans+TC:wght@300;400&family=Noto+Serif+TC:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 固定的大理石紋理背景 -->
    <div class="marble-bg"></div>

    <!-- 頂部導覽列 -->
    <nav class="glass-nav">
        <div class="nav-container">
            <h1 class="logo">Lavend/r</h1>
            <ul class="nav-links">
                <li><a href="#home" class="nav-item active" data-i18n="nav_home">首頁</a></li>
                <li><a href="#story" class="nav-item" data-i18n="nav_story">品牌故事</a></li>
                <li><a href="#shop" class="nav-item" data-i18n="nav_shop">商品</a></li>
                <li><a href="#support" class="nav-item" data-i18n="nav_support">客服與政策</a></li>
                <li><a href="#member" class="nav-item" data-i18n="nav_member">會員系統</a></li>
            </ul>
            <button id="lang-btn" class="lang-toggle">EN / 中</button>
        </div>
    </nav>

    <!-- 內容區塊 (毛玻璃資訊卡) -->
    <main class="main-content">
        <!-- 1. 首頁 -->
        <section id="home" class="page-section glass-card active">
            <h2 class="serif-title" data-i18n="home_title">主視覺與當季活動</h2>
            <p data-i18n="home_desc">Hero Section & Pop-up & News 測試區塊。為您的空間注入輕奢與呼吸感。</p>
        </section>

        <!-- 2. 品牌故事 -->
        <section id="story" class="page-section glass-card">
            <h2 class="serif-title" data-i18n="story_title">品牌故事</h2>
            <p data-i18n="story_desc">Brand Story 測試區塊。將舒適感與空間美學帶入日常。</p>
        </section>

        <!-- 3. 商品頁面 -->
        <section id="shop" class="page-section glass-card">
            <h2 class="serif-title" data-i18n="shop_title">商品與主打</h2>
            <p data-i18n="shop_desc">Shop & Products 測試區塊。未來可在此展示香氛選物清單。</p>
        </section>

        <!-- 4. FAQ 與政策 -->
        <section id="support" class="page-section glass-card">
            <h2 class="serif-title" data-i18n="support_title">常見問題與退換貨政策</h2>
            <p data-i18n="support_desc">Support & Policy 測試區塊。提供最完善的售後服務與物流資訊。</p>
        </section>

        <!-- 5. 會員系統 -->
        <section id="member" class="page-section glass-card">
            <h2 class="serif-title" data-i18n="member_title">會員登記 / 登入</h2>
            <p data-i18n="member_desc">Member System 測試區塊。累積點數、兌換專屬禮遇與禮券。</p>
        </section>
    </main>

    <!-- 引入語言包與邏輯腳本 -->
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
